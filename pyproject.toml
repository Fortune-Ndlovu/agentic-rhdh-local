[project]
name = "agentic-rhdh-local"
version = "0.1.0"
description = "Multi-agent CLI for automated RHDH onboarding — scan repos, propose plugins, generate catalog entities"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "rich>=13.9.0",
    "textual>=0.80.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.9.0",
]

[project.scripts]
agentic-rhdh = "agentic.__main__:app"

[tool.setuptools.packages.find]
include = ["agentic*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
